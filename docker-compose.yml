services:
  # ==============================================
  # Neo4j — 图数据库，OpenZep 的记忆图谱存储后端
  # ==============================================
  neo4j:
    image: neo4j:5
    container_name: microfish-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password123}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-password123}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ==============================================
  # OpenZep — Zep API 兼容记忆服务，提供长期记忆与知识图谱
  # ==============================================
  openzep:
    build: ./openzep
    container_name: microfish-openzep
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GRAPH_DB: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password123}
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  # ==============================================
  # MiroFish — 多智能体群体智能预测引擎
  # ==============================================
  mirofish:
    build: ./mirofish
    container_name: microfish-mirofish
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5001:5001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # LLM 配置从 .env 统一注入
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL_NAME: ${LLM_MODEL}
      # Zep 地址指向同网络下的 OpenZep 容器
      ZEP_API_KEY: ${API_KEY:-}
      ZEP_BASE_URL: http://openzep:8000/api/v2
    volumes:
      - ./mirofish/backend/uploads:/app/backend/uploads
      - ./mirofish/backend/app:/app/backend/app
      - ./mirofish/locales:/app/locales
    depends_on:
      - openzep
    restart: unless-stopped

volumes:
  neo4j_data:
